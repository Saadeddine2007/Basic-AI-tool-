[project]
name = "llm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Saad Herbili", email = "saadherbili2007@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.7",
    "langchain-google-genai>=4.0.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.17",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[project.scripts]
llm = "llm:main"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"
